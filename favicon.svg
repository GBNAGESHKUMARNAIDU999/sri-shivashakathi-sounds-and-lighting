<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18182c"/>
      <stop offset="70%" stop-color="#08080f"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff80ab"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>

  <!-- Audio Equalizer Bars at bottom -->
  <g opacity="0.85">
    <rect x="146" y="340" width="10" height="26" rx="5" fill="url(#pinkGrad)"/>
    <rect x="166" y="325" width="10" height="41" rx="5" fill="url(#cyanGrad)"/>
    <rect x="186" y="310" width="10" height="56" rx="5" fill="url(#goldGrad)"/>
    <rect x="206" y="330" width="10" height="36" rx="5" fill="url(#cyanGrad)"/>
    <rect x="226" y="295" width="10" height="71" rx="5" fill="url(#goldGrad)"/>
    <rect x="246" y="285" width="10" height="81" rx="5" fill="url(#pinkGrad)"/>
    <rect x="266" y="285" width="10" height="81" rx="5" fill="url(#pinkGrad)"/>
    <rect x="286" y="295" width="10" height="71" rx="5" fill="url(#goldGrad)"/>
    <rect x="306" y="330" width="10" height="36" rx="5" fill="url(#cyanGrad)"/>
    <rect x="326" y="310" width="10" height="56" rx="5" fill="url(#goldGrad)"/>
    <rect x="346" y="325" width="10" height="41" rx="5" fill="url(#cyanGrad)"/>
    <rect x="366" y="340" width="10" height="26" rx="5" fill="url(#pinkGrad)"/>
  </g>

  <!-- Sacred OM Symbol in Gold -->
  <text x="256" y="245" 
        text-anchor="middle" 
        dominant-baseline="central" 
        font-family="'Cinzel', 'Noto Sans Devanagari', 'Segoe UI', serif" 
        font-weight="900" 
        font-size="190" 
        fill="url(#goldGrad)" 
        filter="url(#glow)">&#x0950;</text>

  <!-- Subtitle Text Ring -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="'Cinzel', sans-serif" 
        font-weight="700" 
        font-size="28" 
        letter-spacing="5" 
        fill="#FFFFFF" 
        filter="url(#glow)">SHIVASHAKTI</text>
  <text x="256" y="452" 
        text-anchor="middle" 
        font-family="'Inter', sans-serif" 
        font-weight="600" 
        font-size="16" 
        letter-spacing="4" 
        fill="url(#goldGrad)">SOUND &amp; LIGHTING</text>
</svg>
